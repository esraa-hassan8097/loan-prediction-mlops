apiVersion: apps/v1
kind: Deployment

metadata:
  name: loan-api-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: loan-api

  template:
    metadata:
      labels:
        app: loan-api

    spec:
      containers:
        - name: loan-api
          image: loan-prediction:latest 
          ports:
            - containerPort: 5000