name: ML - Training Pipeline

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  training:
    name: ml-training
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ODBC dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc unixodbc-dev curl gnupg

      - name: Install Microsoft ODBC Driver 18
        run: |
          curl -sSL -O \
            https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb

          sudo dpkg -i packages-microsoft-prod.deb

          rm packages-microsoft-prod.deb

          sudo apt-get update

          sudo ACCEPT_EULA=Y \
            apt-get install -y msodbcsql18

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run Fabric data ingestion
        run: |
          mkdir -p ~/.azure-fabric
          cp -r ~/.azure/* ~/.azure-fabric/ 2>/dev/null || true

          AZURE_CONFIG_DIR=$HOME/.azure-fabric \
          python -m src.components.data_ingestion

      - name: Display data lineage
        run: |
          cat artifacts/data_metadata.json

      - name: Validate training data
        run: |
          pytest tests/test_data_validation.py -q

      - name: Verify dataset
        run: |
          python - <<'EOF'
          import json
          import pandas as pd

          train = pd.read_csv("artifacts/train.csv")
          test = pd.read_csv("artifacts/test.csv")

          combined = pd.concat(
              [train, test],
              ignore_index=True
          )

          with open(
              "artifacts/data_metadata.json",
              "r"
          ) as file:
              metadata = json.load(file)

          print("Rows:", len(combined))
          print("Source:", metadata["source"])
          print("Table:", metadata["table"])
          print("Snapshot:", metadata["data_snapshot"])

          assert len(combined) > 0

          print(
              "Training dataset validation passed."
          )
          EOF