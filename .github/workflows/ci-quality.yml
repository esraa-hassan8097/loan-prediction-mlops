name: CI - Quality

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  quality-security:
    name: quality-security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff bandit pip-audit

      - name: Ruff code quality check
        run: |
          ruff check .

      - name: Bandit security scan
        run: |
          bandit -r src app.py -ll

      - name: Dependency vulnerability scan
        run: |
          pip-audit -r requirements.txt

      - name: Run unit tests
        run: |
          pytest tests/unit -q

      - name: Build Docker image
        run: |
          docker build \
            -t loan-prediction-mlops:${{ github.sha }} \
            .

      - name: Azure login
        if: github.event_name == 'push'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        if: github.event_name == 'push'
        run: |
          az acr login --name loanmlopsacr2026

      - name: Tag Docker image
        if: github.event_name == 'push'
        run: |
          docker tag \
            loan-prediction-mlops:${{ github.sha }} \
            loanmlopsacr2026.azurecr.io/loan-prediction-mlops:${{ github.sha }}

          docker tag \
            loan-prediction-mlops:${{ github.sha }} \
            loanmlopsacr2026.azurecr.io/loan-prediction-mlops:latest

      - name: Push Docker image to ACR
        if: github.event_name == 'push'
        run: |
          docker push \
            loanmlopsacr2026.azurecr.io/loan-prediction-mlops:${{ github.sha }}

          docker push \
            loanmlopsacr2026.azurecr.io/loan-prediction-mlops:latest