name: CI - Quality

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-security:
    name: quality-security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff bandit pip-audit

      - name: Ruff code quality check
        run: |
          ruff check .

      - name: Bandit security scan
        run: |
          bandit -r src app.py -ll

      - name: Dependency vulnerability scan
        run: |
          pip-audit -r requirements.txt

      - name: Run unit tests
        run: |
          pytest tests/unit -q

      - name: Build Docker image for validation
        if: github.event_name == 'pull_request'
        run: |
          docker build \
            -t loan-prediction-mlops:${{ github.sha }} \
            .

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            esraadevops/loan-prediction-mlops:${{ github.sha }}
            esraadevops/loan-prediction-mlops:latest
