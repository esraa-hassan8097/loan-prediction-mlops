name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system ODBC dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc unixodbc-dev curl gnupg

      - name: Install Microsoft ODBC Driver 18
        run: |
          curl -sSL -O https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          rm packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Run data ingestion from Microsoft Fabric
        run: |
          mkdir -p ~/.azure-fabric
          cp -r ~/.azure/* ~/.azure-fabric/ 2>/dev/null || true
          AZURE_CONFIG_DIR=$HOME/.azure-fabric python -m src.components.data_ingestion

      - name: Verify updated Fabric data
        run: |
          python - <<'EOF'
          import pandas as pd

          train = pd.read_csv("artifacts/train.csv")
          test = pd.read_csv("artifacts/test.csv")

          combined = pd.concat([train, test], ignore_index=True)

          print("Total rows ingested from Fabric:", len(combined))

          assert len(combined) == 615
          assert "LP999999" in combined["Loan_ID"].values

          print("Fabric updated data verified successfully.")
          EOF

      - name: Run tests
        run: |
          pytest

      - name: Build Docker image
        run: |
          docker build -t loan-prediction-mlops:ci .